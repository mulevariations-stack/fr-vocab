<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フランス語 語彙マスター 10000</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; }
        #setup-screen, #learn-screen { width: 100%; max-width: 400px; }
        #learn-screen { display: none; text-align: center; margin-top: 10px; }
        h1 { font-size: 1.5em; color: #2c3e50; text-align: center; }
        .fr-word { font-size: 2.5em; font-weight: bold; margin-bottom: 5px; }
        .ipa { font-size: 1.2em; color: #666; margin-bottom: 15px; }
        .ja-section { visibility: hidden; opacity: 0; transition: opacity 0.3s; border-top: 2px solid #eee; padding-top: 15px; text-align: left; }
        .ja-section.show { visibility: visible; opacity: 1; }
        .synonyms-box { background: #eef2ff; color: #3730a3; padding: 10px; border-radius: 8px; font-weight: bold; margin: 10px 0; }
        .note { font-size: 0.9em; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .btn { padding: 15px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; color: white; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>📚 語彙マスター</h1>
        <div id="loading-msg">⏳ データ読み込み中...</div>
        <div id="menu-content" style="display: none;">
            <select id="list-select" style="width:100%; padding:15px; margin-bottom:20px;"></select>
            <button class="btn" style="background-color: #3b82f6;" onclick="startLearning()">学習を開始</button>
            <button class="btn" style="background-color: #8b5cf6;" onclick="startReviewing()">苦手リストを復習</button>
        </div>
    </div>

    <div id="learn-screen">
        <div id="fr-word" class="fr-word"></div>
        <div id="ipa" class="ipa"></div>
        <div id="ja-section" class="ja-section">
            <div id="ja-word" style="font-size:1.8em; font-weight:bold;"></div>
            <div id="en-word" style="color:#666;"></div>
            <div id="synonyms-container" class="synonyms-box" style="display:none;">💡 類義語: <span id="synonyms-text"></span></div>
            <div id="ex-fr" style="margin-top:10px; font-style:italic;"></div>
            <div id="ex-ja" style="margin-bottom:10px;"></div>
            <div id="note" class="note"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background-color: #f59e0b; width:50%;" onclick="handleAction('weak')">⚠️ 苦手へ</button>
                <button class="btn" style="background-color: #10b981; width:50%;" onclick="handleAction('master')">★ マスター</button>
            </div>
        </div>
        <button class="btn" style="background-color: #6b7280; margin-top:10px;" onclick="location.reload()">🏠 メニューに戻る</button>
    </div>

    <script>
        let wordDatabase = {}, currentList = [], currentIndex = 0, isPlaying = false;

        window.onload = async () => {
            const res = await fetch('words.csv?v=' + new Date().getTime());
            const text = await res.text();
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            for(let i=1; i<lines.length; i++){
                if(!lines[i].trim()) continue;
                const vals = lines[i].split(',');
                const obj = {};
                headers.forEach((h, j) => obj[h] = vals[j]?.trim());
                if(!wordDatabase[obj.category]) wordDatabase[obj.category] = {name: obj.category_name, words: []};
                wordDatabase[obj.category].words.push(obj);
            }
            const sel = document.getElementById('list-select');
            for(let key in wordDatabase) sel.innerHTML += `<option value="${key}">${wordDatabase[key].name}</option>`;
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('menu-content').style.display = 'block';
        };

        function startLearning() {
            const master = JSON.parse(localStorage.getItem('masterWords') || '[]');
            currentList = wordDatabase[document.getElementById('list-select').value].words.filter(w => !master.some(m => m.fr === w.fr));
            launch();
        }

        function startReviewing() { currentList = JSON.parse(localStorage.getItem('weakWords') || '[]'); launch(); }

        function launch() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('learn-screen').style.display = 'block';
            isPlaying = true; currentIndex = 0; playLoop();
        }

        async function playLoop() {
            if(!isPlaying) return;
            const word = currentList[currentIndex % currentList.length];
            document.getElementById('fr-word').innerText = word.fr;
            document.getElementById('ipa').innerText = word.ipa;
            document.getElementById('ja-section').classList.remove('show');
            
            await new Promise(r => setTimeout(r, 1000));
            document.getElementById('ja-word').innerText = word.ja;
            document.getElementById('en-word').innerText = "(" + word.en + ")";
            document.getElementById('ex-fr').innerText = word.ex_fr;
            document.getElementById('ex-ja').innerText = word.ex_ja;
            document.getElementById('note').innerText = `【Level: ${word.level}】 ${word.note}`;
            
            if(word.synonyms) {
                document.getElementById('synonyms-text').innerText = word.synonyms;
                document.getElementById('synonyms-container').style.display = 'block';
            } else {
                document.getElementById('synonyms-container').style.display = 'none';
            }
            
            document.getElementById('ja-section').classList.add('show');
            // 音声再生を追加
            speechSynthesis.speak(new SpeechSynthesisUtterance(word.fr));
            await new Promise(r => setTimeout(r, 2000));
            speechSynthesis.speak(new SpeechSynthesisUtterance(word.ja));
            await new Promise(r => setTimeout(r, 2000));
            
            currentIndex++;
            playLoop();
        }

        function handleAction(type) {
            const word = currentList[currentIndex % currentList.length];
            let storage = JSON.parse(localStorage.getItem(type === 'weak' ? 'weakWords' : 'masterWords') || '[]');
            if(!storage.some(w => w.fr === word.fr)) {
                storage.push(word);
                localStorage.setItem(type === 'weak' ? 'weakWords' : 'masterWords', JSON.stringify(storage));
                alert("保存しました");
            }
        }
    </script>
</body>
</html>
