<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fr Vocab">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>フランス語学習アプリ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            color: #333;
        }
        
        /* 画面切り替え用のクラス */
        #setup-screen, #learn-screen { width: 100%; max-width: 400px; }
        #learn-screen { display: none; text-align: center; margin-top: 2vh; }

        /* セットアップ画面のUI */
        h1 { font-size: 1.5em; color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .select-box { width: 100%; padding: 15px; font-size: 1.1em; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 20px; }
        
        /* 学習画面のUI */
        .male { color: #0052cc; } /* 青 */
        .female { color: #e11d48; } /* 赤 */
        .neutral { color: #333333; } /* 黒 */

        .fr-section { margin-bottom: 30px; min-height: 120px; }
        .fr-word { font-size: 2.8em; font-weight: bold; margin-bottom: 5px; }
        .ipa { font-size: 1.2em; color: #666; }

        .ja-section { 
            visibility: hidden; opacity: 0; 
            transition: opacity 0.2s ease; 
            border-top: 1px solid #eee; padding-top: 20px;
            min-height: 200px;
        }
        .ja-section.show { visibility: visible; opacity: 1; }
        
        .ja-word { font-size: 1.8em; font-weight: bold; margin-bottom: 5px; }
        .en-word { font-size: 1.2em; color: #666; margin-bottom: 20px; font-style: italic; }
        .example-fr { font-size: 1.2em; margin-bottom: 5px; }
        .example-ja { font-size: 1em; color: #555; margin-bottom: 20px; }
        .note { font-size: 0.9em; background: #f8f9fa; padding: 10px; border-radius: 8px; text-align: left; }

        .controls { width: 100%; max-width: 400px; margin-top: 20px; text-align: center; }
        .btn {
            padding: 15px 30px; font-size: 1.2em; font-weight: bold;
            border: none; border-radius: 25px; cursor: pointer; width: 100%; margin-bottom: 10px;
        }
        .btn-start { background-color: #3b82f6; color: white; margin-top: 20px; }
        .btn-play { background-color: #10b981; color: white; }
        .btn-weak { background-color: #f59e0b; color: white; visibility: hidden; } 
        .btn-home { background-color: #6b7280; color: white; margin-top: 20px; font-size: 1em; padding: 10px; }
        
        .slider-container { margin-top: 15px; font-size: 0.9em; color: #666; }
        input[type="range"] { width: 80%; }
        
        .status-bar { font-size: 0.9em; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>📚 単語リストを選択</h1>
        
        <label for="list-select" style="font-weight:bold; color:#555;">カテゴリー（レベル別）</label>
        <select id="list-select" class="select-box">
            <option value="A1_verbs">A1 基礎・最重要動詞 (20語)</option>
            <option value="A1_nouns_people">A1 人・家族に関する名詞 (15語)</option>
            <option value="A1_nouns_time">A1 時間・場所に関する名詞 (15語)</option>
        </select>

        <div class="slider-container" style="text-align: center;">
            <label style="font-weight:bold; color:#555;">日本語表示までの待機時間</label><br>
            <span id="delay-val-setup" style="font-size:1.5em; font-weight:bold; color:#3b82f6;">0.5</span> 秒<br>
            <input type="range" id="delay-slider-setup" min="0" max="1" step="0.1" value="0.5" oninput="updateDelaySetup()">
        </div>

        <button class="btn btn-start" onclick="startLearning()">学習を開始する</button>
    </div>

    <div id="learn-screen">
        <div class="status-bar" id="status-bar">リスト: 未選択 (1/10)</div>
        
        <div class="fr-section">
            <div id="fr-word" class="fr-word neutral"></div>
            <div id="ipa" class="ipa"></div>
        </div>

        <div id="ja-section" class="ja-section">
            <div id="ja-word" class="ja-word neutral"></div>
            <div id="en-word" class="en-word"></div>
            <div id="example-fr" class="example-fr"></div>
            <div id="example-ja" class="example-ja"></div>
            <div id="note" class="note"></div>
        </div>

        <div class="controls">
            <button id="weak-btn" class="btn btn-weak" onclick="markAsWeak()">⚠️ 苦手リストに追加</button>
            <button id="play-btn" class="btn btn-play" onclick="togglePlay()">■ ストップ</button>
            <button class="btn btn-home" onclick="goHome()">🏠 メニューに戻る</button>
        </div>
    </div>

    <script>
        // 単語データベース（1万語でもここに追加・分割していけます）
        const wordDatabase = {
            "A1_verbs": [
                { fr: "être", ipa: "[ɛtʁ]", ja: "〜である・いる", en: "be", level: "A1", ex_fr: "Je suis là.", ex_ja: "私はここにいる。", note: "英語のbe動詞に相当する超基本動詞。", gender: "neutral" },
                { fr: "avoir", ipa: "[avwaʁ]", ja: "持つ・ある", en: "have", level: "A1", ex_fr: "Il a un livre.", ex_ja: "彼は本を持っている。", note: "英語のhaveに相当する。", gender: "neutral" },
                { fr: "aller", ipa: "[ale]", ja: "行く", en: "go", level: "A1", ex_fr: "Je vais au cinéma.", ex_ja: "映画館に行く。", note: "不規則変化する最重要動詞の一つ。", gender: "neutral" },
                { fr: "faire", ipa: "[fɛʁ]", ja: "する・作る", en: "make/do", level: "A1", ex_fr: "Je fais mes devoirs.", ex_ja: "宿題をする。", note: "英語のdo/makeの両方に相当。", gender: "neutral" },
                { fr: "dire", ipa: "[diʁ]", ja: "言う", en: "say/tell", level: "A1", ex_fr: "Il dit la vérité.", ex_ja: "彼は真実を言う。", note: "英語のsayと同等に頻出。", gender: "neutral" }
            ],
            "A1_nouns_people": [
                { fr: "un homme", ipa: "[ɔm]", ja: "男・人間", en: "man", level: "A1", ex_fr: "C'est un homme bon.", ex_ja: "彼は良い男だ。", note: "英語のhumanと同語源。", gender: "male" },
                { fr: "une femme", ipa: "[fam]", ja: "女・妻", en: "woman/wife", level: "A1", ex_fr: "Elle est une femme forte.", ex_ja: "彼女は強い女性だ。", note: "英語のfemaleと同語源。", gender: "female" },
                { fr: "un enfant", ipa: "[ɑ̃fɑ̃]", ja: "子供", en: "child", level: "A1", ex_fr: "L'enfant joue.", ex_ja: "子供が遊ぶ。", note: "英語のinfantと同語源。", gender: "male" },
                { fr: "un père", ipa: "[pɛʁ]", ja: "父", en: "father", level: "A1", ex_fr: "Mon père est médecin.", ex_ja: "私の父は医者です。", note: "英語のpaternalと同語源。", gender: "male" },
                { fr: "une mère", ipa: "[mɛʁ]", ja: "母", en: "mother", level: "A1", ex_fr: "Sa mère est gentille.", ex_ja: "彼の母は優しい。", note: "英語のmaternalと同語源。", gender: "female" }
            ],
            "A1_nouns_time": [
                { fr: "un jour", ipa: "[ʒuʁ]", ja: "日・1日", en: "day", level: "A1", ex_fr: "Un jour je viendrai.", ex_ja: "いつか私は来る。", note: "英語のjournalなどの語源。", gender: "male" },
                { fr: "une heure", ipa: "[œʁ]", ja: "時間・時刻", en: "hour", level: "A1", ex_fr: "Il est une heure.", ex_ja: "1時です。", note: "英語のhourと同語源・hは発音しない。", gender: "female" },
                { fr: "un an", ipa: "[ɑ̃]", ja: "年(単位)", en: "year", level: "A1", ex_fr: "J'ai vingt ans.", ex_ja: "私は20歳です。", note: "英語のannualと同語源。", gender: "male" },
                { fr: "une ville", ipa: "[vil]", ja: "街・都市", en: "city", level: "A1", ex_fr: "J'habite dans une ville.", ex_ja: "私は街に住んでいる。", note: "英語のvillageと同語源。", gender: "female" },
                { fr: "une maison", ipa: "[mɛzɔ̃]", ja: "家", en: "house", level: "A1", ex_fr: "Je rentre à la maison.", ex_ja: "家に帰る。", note: "英語のmansionと同語源。", gender: "female" }
            ]
        };

        let currentList = [];
        let currentIndex = 0;
        let isPlaying = false;
        let delaySeconds = 0.5;

        // メニュー画面でのスライダー更新
        function updateDelaySetup() {
            delaySeconds = document.getElementById('delay-slider-setup').value;
            document.getElementById('delay-val-setup').innerText = delaySeconds;
        }

        // ホーム画面に戻る
        function goHome() {
            isPlaying = false;
            speechSynthesis.cancel();
            document.getElementById('learn-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }

        // 学習スタート
        function startLearning() {
            const selectedKey = document.getElementById('list-select').value;
            currentList = wordDatabase[selectedKey];
            currentIndex = 0;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('learn-screen').style.display = 'block';
            
            isPlaying = true;
            document.getElementById('play-btn').innerText = "■ ストップ";
            document.getElementById('play-btn').style.backgroundColor = "#ef4444";
            
            playLoop();
        }

        function markAsWeak() {
            const btn = document.getElementById('weak-btn');
            btn.innerText = "✓ 登録しました";
            btn.style.backgroundColor = "#9ca3af";
            // TODO: ここに苦手リスト保存のロジックを追加可能
        }

        function speak(text, lang) {
            return new Promise(resolve => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = lang === 'fr-FR' ? 0.8 : 1.0; 
                utterance.onend = resolve;
                speechSynthesis.speak(utterance);
            });
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function playLoop() {
            if (!isPlaying || currentList.length === 0) return;

            const word = currentList[currentIndex];
            const frWordEl = document.getElementById('fr-word');
            const jaWordEl = document.getElementById('ja-word');
            const jaSection = document.getElementById('ja-section');
            const weakBtn = document.getElementById('weak-btn');
            const statusBar = document.getElementById('status-bar');

            // ステータス更新
            statusBar.innerText = `学習中: ${currentIndex + 1} / ${currentList.length} 語`;

            // UIリセット：チラ見え防止のため、日本語のテキストを空にしてから隠す
            jaWordEl.innerText = ""; 
            jaSection.classList.remove('show');
            weakBtn.style.visibility = 'hidden';
            weakBtn.innerText = "⚠️ 苦手リストに追加";
            weakBtn.style.backgroundColor = "#f59e0b";

            // 性別カラーの適用
            frWordEl.className = `fr-word ${word.gender}`;
            jaWordEl.className = `ja-word ${word.gender}`;

            // フランス語側の表示
            frWordEl.innerText = word.fr;
            document.getElementById('ipa').innerText = word.ipa;
            
            // 1. 仏語再生
            await speak(word.fr, 'fr-FR');
            if (!isPlaying) return;

            // 2. 待機（スライダー設定秒数）
            await sleep(delaySeconds * 1000);
            if (!isPlaying) return;

            // 3. 待機完了後に、初めて日本語データを入れ込み、画面に表示させる
            jaWordEl.innerText = word.ja;
            document.getElementById('en-word').innerText = word.en;
            document.getElementById('example-fr').innerText = word.ex_fr;
            document.getElementById('example-ja').innerText = word.ex_ja;
            document.getElementById('note').innerText = `【レベル: ${word.level}】 ${word.note}`;
            
            jaSection.classList.add('show');
            weakBtn.style.visibility = 'visible';

            // 4. 日本語再生
            await speak(word.ja, 'ja-JP');
            if (!isPlaying) return;

            // 次の単語へ進む
            currentIndex = (currentIndex + 1) % currentList.length;
            playLoop(); 
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                isPlaying = false;
                speechSynthesis.cancel();
                btn.innerText = "▶ 再開する";
                btn.style.backgroundColor = "#10b981";
            } else {
                isPlaying = true;
                btn.innerText = "■ ストップ";
                btn.style.backgroundColor = "#ef4444";
                playLoop();
            }
        }
    </script>
</body>
</html>
